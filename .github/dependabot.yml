# Keeps dependencies moving continuously so security advisories are fixed by
# routine updates before they ever become an alert email.
#
# Tuned for minimal noise:
#   - MONTHLY, not weekly.
#   - Minor and patch updates are GROUPED into a single pull request per
#     ecosystem, and auto-merge once CI passes (see ci.yml), so a normal month
#     produces nothing to look at.
#   - Major updates are IGNORED entirely. They are where breaking changes live,
#     so they always needed a human, and a queue of pull requests waiting for
#     one is the noise this configuration is meant to avoid.
#
# The cost of ignoring majors, stated plainly: some advisories are only ever
# fixed in a new major. Next.js was exactly this — several advisories against
# 14.x had no 14.x fix at all and were patched only in 15.5.x. When that
# happens you will get an alert email with no pull request attached, and the
# upgrade has to be done by hand. Run `npm outdated` / `./mvnw versions:display-dependency-updates`
# occasionally, or drop the `ignore` blocks below for a while, to catch up.
version: 2

updates:
  # ---------- Frontend (Next.js / npm) ----------
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - frontend
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---------- Backend (Spring Boot / Maven) ----------
  # Worth having even though GitHub's dependency graph cannot match advisories
  # against BOM-managed transitive versions: Dependabot can still bump the
  # spring-boot-starter-parent version declared in pom.xml, which is what pulls
  # patched Tomcat, Spring, Hibernate and Jackson forward.
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - backend
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      maven-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---------- GitHub Actions ----------
  # Action versions are a supply-chain surface of their own and are easy to
  # forget, since nothing in the app build fails when they go stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      actions:
        patterns:
          - "*"
