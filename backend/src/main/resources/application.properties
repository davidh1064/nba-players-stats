spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL logging is off by default: statements include query parameters, so leaving
# it on writes user-supplied search terms into the application log.
spring.jpa.show-sql=false

# Admin credentials for the write endpoints (POST/PUT/DELETE /api/players).
# There is no default; startup fails if these are unset. See backend/.env.example.
app.security.admin-username=${ADMIN_USERNAME:}
app.security.admin-password=${ADMIN_PASSWORD:}

# Comma-separated browser origins allowed to call the API.
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

# Do not leak stack traces or internal messages to API clients.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
